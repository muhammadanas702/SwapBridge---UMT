<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D0916"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>SectionSwap</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0916;--card:#171027;--line:#2B2147;--tx:#EFEAFE;--mut:#9A8FBF;--p:#A855F7;--p2:#7C3AED;--lime:#D4FF3A;--red:#FF5C7A;color-scheme:dark}
*{box-sizing:border-box;margin:0}body{font:15px/1.5 Figtree,system-ui,sans-serif;background:radial-gradient(900px 500px at 85% -10%,#2a1255,transparent),var(--bg);color:var(--tx);min-height:100vh;padding:env(safe-area-inset-top) 0 0}

.i{width:20px;height:20px;flex:none}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{padding:22px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-size:22px;font-weight:800;padding:0 10px 18px;display:flex;gap:8px;align-items:center}.brand b{color:var(--lime)}
nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--mut);text-decoration:none;font-weight:500;position:relative}
nav a:hover{color:var(--tx);background:#ffffff0a}nav a.on{background:linear-gradient(90deg,#a855f733,transparent);color:var(--tx);box-shadow:inset 3px 0 var(--p)}
nav .sp{flex:1}.dot{background:var(--lime);color:#000;font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;margin-left:auto}
main{padding:28px clamp(16px,4vw,44px) 90px;max-width:980px;width:100%;animation:up .35s ease both}@keyframes up{from{opacity:0;transform:translateY(8px)}}
.card,.tk{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.stat .big{font-size:36px;font-weight:800;color:var(--lime)}.stat small{color:var(--mut)}
.tk{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;position:relative;border-left:3px solid var(--p)}
.tk-l b{font:800 20px Syne}.tk-l small{display:block;color:var(--mut)}.tk-r{display:flex;align-items:center;gap:8px;color:var(--p)}
.tk-r i{font:800 20px Syne;font-style:normal;border:1.5px solid var(--line);border-radius:10px;min-width:44px;text-align:center;padding:2px 10px}.tk-r i.w{border-color:var(--p);color:var(--lime)}
.tk .x{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px dashed var(--line);padding-top:12px}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;background:#ffffff12;color:var(--mut)}.pill.active,.pill.mutual,.pill.completed{background:#d4ff3a22;color:var(--lime)}.pill.approval_pending{background:#a855f733;color:#d8b4fe}.pill.declined,.pill.cancelled,.pill.expired{background:#ff5c7a22;color:var(--red)}
button,.btn{font:600 14px Figtree;border:1px solid var(--line);background:#ffffff0d;color:var(--tx);border-radius:12px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center;transition:.15s}
button:hover,.btn:hover{border-color:var(--p);transform:translateY(-1px)}.pr{background:linear-gradient(135deg,var(--p),var(--p2));border:0;color:#fff}.dg{color:var(--red)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
form.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}label{display:grid;gap:4px;font-size:13px;color:var(--mut);font-weight:500}
input,select,textarea{font:inherit;background:#0D0916;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}input:focus,select:focus,textarea:focus{border-color:var(--p);outline:0}
.full{grid-column:1/-1}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.empty{text-align:center;color:var(--mut);padding:40px 10px;border:1px dashed var(--line);border-radius:18px}
.why{color:var(--mut);font-size:13px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--lime);color:#000;font-weight:600;padding:10px 18px;border-radius:99px;z-index:9;animation:up .3s}.toast.bad{background:var(--red);color:#fff}
.auth{max-width:420px;margin:8vh auto;padding:20px}.auth .brand{font-size:34px;padding:0 0 6px}.auth p{color:var(--mut);margin-bottom:18px}.tabs{display:flex;gap:8px;margin-bottom:14px}
.note{color:var(--mut);font-size:12px;margin-top:12px}.nt{display:flex;gap:10px;align-items:center}.nt.u{border-left:3px solid var(--lime)}
@media(max-width:800px){.shell{display:block}nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;justify-content:space-around;z-index:5;background:#0D0916ee;backdrop-filter:blur(12px);border:0;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto}.brand,nav .sp,nav a span{display:none}nav a{padding:10px}nav a.on{box-shadow:none}.dot{position:absolute;top:2px;right:0}}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--p);vertical-align:middle;margin-right:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><script>
const P={calendar:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>'};
const I=n=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');let me,unread=0,CAT=[],BQ={page:1};if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
async function api(m,u,b){const r=await fetch('/api/v1'+u,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Something went wrong');return d}
const toast=(t,bad)=>{const e=document.createElement('div');e.className='toast'+(bad?' bad':'');e.textContent=t;e.setAttribute('role','status');document.body.append(e);setTimeout(()=>e.remove(),3000)};
const ST={draft:'Draft',active:'Live',paused:'Paused',cancelled:'Cancelled',expired:'Expired',pending:'Awaiting responses',mutual:'Mutual interest',approval_pending:'Awaiting university approval',completed:'Completed (self-reported)',declined:'Declined',closed:'Closed'};
const pill=s=>`<span class="pill ${s}">${ST[s]||s}</span>`;
const tk=(r,x='')=>`<article class="tk"><div class="tk-l"><b>${esc(r.course)}</b><small>${esc(r.cname||'')} · ${esc(r.term)}</small></div><div class="tk-r" aria-label="Section ${esc(r.cur)} to ${esc(r.want)}"><i>${esc(r.cur)}</i>${I('repeat')}<i class="w">${esc(r.want)}</i></div>${x?`<div class="x">${x}</div>`:''}</article>`;
const empty=(t,l,h)=>`<div class="empty">${t}${l?`<div class="row" style="justify-content:center"><a class="btn pr" href="${h}">${l}</a></div>`:''}</div>`;
const fld=(n,l,v='',t='text',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`;
const btn=(c,t,o={})=>`<button class="${o.k||''}" data-c="${c}" ${o.cf?`data-cf="${o.cf}"`:''} ${o.pr?`data-pr="${o.pr}"`:''} ${o.b?`data-b='${o.b}'`:''} data-ok="${o.ok||'Done'}">${t}</button>`;
const NAV=[['home','Dashboard','home'],['new','Create Request','plus'],['browse','Browse','search'],['mine','My Requests','list'],['matches','My Matches','repeat'],['timetable','Timetable','calendar'],['notifs','Notifications','bell'],['history','Swap History','clock'],['profile','Profile','user']];
const shell=(v,b)=>`<div class="shell"><nav aria-label="Main"><div class="brand">${I('repeat')}Section<b>Swap</b></div>${NAV.concat(me.role==='admin'?[['admin','Admin','shield']]:[]).map(([k,l,i])=>`<a href="#/${k}" class="${v===k?'on':''}" ${v===k?'aria-current="page"':''} title="${l}">${I(i)}<span>${l}</span>${k==='notifs'&&unread?`<em class="dot">${unread}</em>`:''}</a>`).join('')}</nav><main>${b}</main></div>`;
const DAYOPT=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<option>${d}</option>`).join('');
const dl=(id,a)=>`<datalist id="${id}">${[...new Set(a)].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
const authView=()=>`<div class="auth"><div class="brand">${I('repeat')}Section<b>Swap</b></div><p>Find a student who wants your section - while you want theirs.</p>
<div class="tabs"><button class="pr" onclick="sh('lg')">Log in</button><button onclick="sh('rg')">Register</button><button onclick="sh('fg')">Forgot password</button></div>
<form id="lg" class="card g" data-f="POST /auth/login" data-ok="Welcome back">${fld('email','Email','','email','required autocomplete=email')}${fld('password','Password','','password','required autocomplete=current-password')}<button class="pr full">Log in</button></form>
<form id="rg" class="card g" hidden data-f="POST /auth/register" data-ok="Account created">${fld('name','Display name','','text','required')}${fld('email','Email','','email','required')}${fld('password','Password (8+)','','password','required minlength=8 autocomplete=new-password')}${fld('uni','University')}${fld('campus','Campus')}${fld('program','Degree program')}${fld('semester','Semester','','number','min=1 max=12')}<button class="pr full">Create account</button></form>
<form id="fg" class="card g" hidden data-f="POST /auth/forgot" data-ok="If the email exists, a reset token was issued">${fld('email','Account email','','email','required')}<button class="pr full">Request reset</button><p class="note full">No email service is configured, so the token is printed in the server console. Paste it below.</p></form>
<form id="rs" class="card g" hidden data-f="POST /auth/reset" data-ok="Password updated - log in">${fld('token','Reset token','','text','required')}${fld('password','New password (8+)','','password','required minlength=8')}<button class="pr full">Set new password</button></form>
<p class="note">Demo (fictional): ayesha@demo.test / bilal@demo.test / admin@demo.test - password demo1234</p></div>`;
window.sh=id=>{for(const f of['lg','rg','fg','rs'])document.getElementById(f).hidden=f!==id&&!(id==='fg'&&f==='rs')};
const reqForm=(r={})=>`<form class="card g" data-f="${r.id?'PATCH /requests/'+r.id:'POST /requests'}" data-go="#/mine" data-ok="Saved">${dl('dc',CAT.map(x=>x.course))}${dl('dt',CAT.map(x=>x.term))}${dl('ds',CAT.map(x=>x.section))}${fld('course','Course code',r.course,'text','required list=dc placeholder="CS201"')}${fld('cname','Course name',r.cname,'text','required')}${fld('term','Academic term',r.term||'Fall 2026','text','required list=dt')}${fld('cur','Current section',r.cur,'text','required list=ds')}${fld('want','Desired section',r.want,'text','required list=ds')}${fld('expires','Expiry date',r.expires,'date')}${fld('alt','Alternative sections (optional)',r.alt)}${fld('days','Preferred days / times',r.days,'text','placeholder="Mon-Wed mornings"')}
<label>Reason<select name="reason">${['Timetable clash','Preferred class timing','Transport difficulty','Work or personal scheduling','Other'].map(o=>`<option ${o===r.reason?'selected':''}>${o}</option>`).join('')}</select></label><label>Timetable compatibility<select name="tt">${['optional','preferred','required'].map(o=>`<option ${o===(r.tt||'optional')?'selected':''}>${o}</option>`).join('')}</select></label><label class="full">Notes<textarea name="notes" rows="3" maxlength="500">${esc(r.notes)}</textarea></label>
<div id="pv" class="full"></div><div class="row full"><button type="button" data-prev>Preview</button><button name="draft" value="draft">Save draft</button><button class="pr" name="publish" value="1">${I('repeat')}Publish request</button></div></form>`;
const V={
async home(){const[m,r,n]=await Promise.all([api('GET','/matches'),api('GET','/requests/mine'),api('GET','/notifications')]);const c=s=>m.items.filter(x=>x.status===s).length;
 return `<h1>${me.avatar?`<img class="av" src="${esc(me.avatar)}" alt="">`:''}Hi, ${esc(me.name)}</h1><p class="why">Your swap radar.</p><h2>Overview</h2><div class="stats">${[['Live requests',r.items.filter(x=>x.st==='active').length],['Potential matches',c('pending')],['Pending interests',m.items.filter(x=>x.their?.interest==='interested'&&x.my.interest!=='interested').length],['Mutual matches',c('mutual')],['Approval pending',c('approval_pending')],['Unread alerts',n.items.filter(x=>!x.read).length]].map(([l,v])=>`<div class="stat"><div class="big">${v}</div><small>${l}</small></div>`).join('')}</div>
 <div class="row"><a class="btn pr" href="#/new">${I('plus')}Create request</a><a class="btn" href="#/browse">${I('search')}Browse</a><a class="btn" href="#/matches">${I('repeat')}Find matches</a></div>
 <h2>Expiring soon</h2>${r.items.filter(x=>x.st==='active'&&x.expires).map(x=>tk(x,`<span class="why">Expires ${esc(x.expires)}</span>`)).join('')||'<p class="why">Nothing expiring.</p>'}
 <h2>Recent activity</h2>${n.items.slice(0,5).map(x=>`<a class="card nt ${x.read?'':'u'}" href="${esc(x.link)}">${I('bell')}${esc(x.text)}</a>`).join('')||'<p class="why">No activity yet.</p>'}`},
async new(){CAT=(await api('GET','/catalog')).items;return `<h1>Create swap request</h1><p class="why">Same course, same term. Both sides must agree before anything moves forward.</p><br>${reqForm()}`},
async edit(id){CAT=(await api('GET','/catalog')).items;const r=(await api('GET','/requests/mine')).items.find(x=>x.id==id);return r?`<h1>Edit request</h1><br>${reqForm(r)}`:empty('Request not found')},
async mine(){const{items}=await api('GET','/requests/mine');return `<h1>My requests</h1><br>${items.map(r=>tk(r,`${pill(r.st)}<span class="why">${r.matches} match${r.matches==1?'':'es'} · ${r.expires?'expires '+esc(r.expires):'no expiry'}</span><span style="flex:1"></span>${r.st!=='cancelled'&&r.st!=='expired'?`<a class="btn" href="#/edit/${r.id}">Edit</a>`:''}${{draft:btn(`POST /requests/${r.id}/publish`,'Publish',{k:'pr'})+btn(`DELETE /requests/${r.id}`,'Delete',{k:'dg',cf:'Delete this draft?'}),active:btn(`POST /requests/${r.id}/find`,'Find matches',{ok:'Search complete'})+btn(`POST /requests/${r.id}/pause`,'Pause')+btn(`POST /requests/${r.id}/cancel`,'Cancel',{k:'dg',cf:'Cancel this request?'}),paused:btn(`POST /requests/${r.id}/resume`,'Resume',{k:'pr'})+btn(`POST /requests/${r.id}/cancel`,'Cancel',{k:'dg',cf:'Cancel this request?'}),expired:btn(`POST /requests/${r.id}/renew`,'Renew',{k:'pr'}),cancelled:''}[r.st]||''}`)).join('')||empty('No requests yet.','Create your first','#/new')}`},
async browse(){const qs=new URLSearchParams(Object.entries(BQ).filter(([,v])=>v)).toString(),d=await api('GET','/requests?'+qs);
 return `<h1>Browse requests</h1><br><form class="card g" data-bf>${fld('q','Course code or name',BQ.q)}${fld('term','Term',BQ.term)}${fld('cur','Current section',BQ.cur)}${fld('want','Desired section',BQ.want)}${fld('since','Posted since',BQ.since,'date')}<label>Timetable pref<select name="tt"><option value="">Any</option>${['required','preferred','optional'].map(o=>`<option ${BQ.tt===o?'selected':''}>${o}</option>`).join('')}</select></label><label>Sort<select name="sort"><option value="">Newest</option><option value="expiry" ${BQ.sort==='expiry'?'selected':''}>Expiring soon</option></select></label><button class="pr" style="align-self:end">${I('search')}Filter</button></form>
 ${d.items.map(r=>tk(r,`<span class="why">${esc(r.owner)} · ${esc(r.uni||'')} ${esc(r.campus||'')}</span>${r.reason?`<span class="pill">${esc(r.reason)}</span>`:''}${r.days?`<span class="pill">${esc(r.days)}</span>`:''}${r.alt?`<span class="pill">Alt: ${esc(r.alt)}</span>`:''}`)).join('')||empty('No requests match these filters.')}
 <div class="row"><button data-pg="${d.page-1}" ${d.page<2?'disabled':''}>Prev</button><span class="why" style="align-self:center">Page ${d.page} · ${d.total} total</span><button data-pg="${d.page+1}" ${d.page*8>=d.total?'disabled':''}>Next</button></div>`},
async matches(){const{items}=await api('GET','/matches');return `<h1>My matches</h1><p class="why">Exact reciprocal fits. Nothing is official until your university approves it.</p><br>${items.filter(m=>!['declined','cancelled','closed','completed'].includes(m.status)).map(m=>{const b=`POST /matches/${m.id}/`,s=m.status;
 return tk(m,`${pill(s)}<span class="pill ${m.tt.s==='clash'?'declined':m.tt.s==='ok'?'active':''}">Timetable: ${m.tt.s} (unverified)</span><span class="why">${esc(m.why)}${m.tt.d.length?' Conflicts: '+esc(m.tt.d.join('; ')):''}</span><div class="row full" style="flex-basis:100%">${m.my.interest!=='interested'?btn(b+'interest','Express interest',{k:'pr'})+btn(b+'decline','Decline',{k:'dg'}):btn(b+'withdraw','Withdraw interest')}${s==='mutual'&&!m.my.confirm?btn(b+'confirm','Confirm swap',{k:'pr',ok:'Confirmed'}):''}${s==='approval_pending'?btn(b+'outcome','Mark approved (self-reported)',{k:'pr'}):''}${['mutual','approval_pending'].includes(s)?btn(b+'cancel','Cancel match',{k:'dg',cf:'Cancel this match?'}):''}${btn(b+'report','Report',{pr:'Why are you reporting this student?'})}${btn(b+'block','Block',{k:'dg',cf:'Block this student?'})}</div>${s==='pending'?`<span class="why">${m.their.interest==='interested'?'They are interested. ':''}Waiting for both of you.</span>`:''}${m.contact?`<span class="pill active">Contact: ${esc(m.contact)}</span>`:`<span class="why">Contact details unlock after both confirm.</span>`}`)}).join('')||empty('No active matches yet. Publish a request and we will keep watching.','Create request','#/new')}`},
async notifs(){const c=BQ.cat||'',{items}=await api('GET','/notifications'+(c?'?cat='+c:''));await api('POST','/notifications/read');unread=0;return `<h1>Notifications</h1><div class="row">${['','match','consent','expiry','moderation'].map(k=>`<button class="${c===k?'pr':''}" data-cat="${k}">${k||'All'}</button>`).join('')}</div><br>${items.map(x=>`<a class="card nt ${x.read?'':'u'}" href="${esc(x.link)}">${I('bell')}<span>${esc(x.text)}<br><small class="why">${esc(x.cat)} · ${esc(x.created)}</small></span></a>`).join('')||empty('All caught up.')}`},
async history(){const h=await api('GET','/history'),c=(BQ.hc||'').toUpperCase(),t=BQ.ht||'',s=BQ.hs||'',d=BQ.hd||'',ok=(x,st)=>(!c||x.course.includes(c))&&(!t||x.term===t)&&(!s||st===s)&&(!d||String(x.created).slice(0,10)>=d),rs=h.requests.filter(x=>ok(x,x.st)),ms=h.matches.filter(x=>ok(x,x.status));
 return `<h1>Swap history</h1><p class="why">"Completed" means coordination between students, self-reported - not a verified enrollment change.</p><br><form class="card g" data-hf>${fld('hc','Course',BQ.hc)}${fld('ht','Term',BQ.ht)}<label>Status<select name="hs"><option value="">All</option>${['cancelled','expired','declined','closed','completed'].map(k=>`<option value="${k}" ${s===k?'selected':''}>${ST[k]}</option>`).join('')}</select></label>${fld('hd','Since',BQ.hd,'date')}<button class="pr" style="align-self:end">Filter</button></form>${rs.map(r=>tk(r,pill(r.st))).join('')}${ms.map(m=>tk(m,`${pill(m.status)}${m.outcome?`<span class="why">${esc(m.outcome)}</span>`:''}`)).join('')||(rs.length?'':empty('Nothing here yet.'))}`},
async timetable(){const{items}=await api('GET','/timetable');return `<h1>My timetable</h1><p class="why">Entered by you, so unverified. Used to detect clashes with the section you want.</p><br><form class="card g" data-f="POST /timetable" data-ok="Class added">${fld('course','Course','','text','required')}${fld('section','Section')}<label>Day<select name="day">${DAYOPT}</select></label>${fld('start','Start','','time','required')}${fld('end','End','','time','required')}<button class="pr" style="align-self:end">Add class</button></form>${items.map(s=>`<div class="card nt">${I('calendar')}<span><b>${esc(s.course)}</b> ${esc(s.section)} · ${s.day} ${s.start}-${s.end}</span><span style="flex:1"></span>${btn(`DELETE /timetable/${s.id}`,'Remove',{k:'dg'})}</div>`).join('')||empty('No classes yet. Matches will show timetable as unknown.')}`},
async profile(){return `<h1>${me.avatar?`<img class="av" src="${esc(me.avatar)}" alt="">`:''}Profile & settings</h1><br><form class="card g" data-f="PATCH /me" data-ok="Profile updated">${fld('name','Display name',me.name)}${fld('uni','University',me.uni)}${fld('campus','Campus',me.campus)}${fld('program','Degree program',me.program)}${fld('semester','Semester',me.semester,'number')}${fld('term','Academic term',me.term)}<label class="full">Profile image (resized to 128px)<input type="file" accept="image/png,image/jpeg,image/webp" data-av="1"></label><button class="pr full">Save</button></form><div class="row">${me.avatar?btn('PATCH /me','Remove image',{b:'{"avatar":""}'}):''}${btn('POST /auth/logout','Log out')}${btn('DELETE /me','Delete account',{k:'dg',cf:'Permanently delete your account and data?'})}</div>`},
async admin(){const[s,r,cat,sr,tr]=await Promise.all([api('GET','/admin/stats'),api('GET','/admin/reports'),api('GET','/catalog'),api('GET','/admin/search?q='+encodeURIComponent(BQ.aq||'')),api('GET','/terms')]);
 return `<h1>Admin</h1><br><div class="stats">${Object.entries(s).map(([k,v])=>`<div class="stat"><div class="big">${v}</div><small>${k}</small></div>`).join('')}</div>
 <h2>Course catalog</h2><form class="card g" data-f="POST /admin/offerings" data-ok="Offering added">${fld('course','Course code','','text','required')}${fld('cname','Course name','','text','required')}${fld('term','Term','','text','required')}${fld('section','Section','','text','required')}<label>Day<select name="day">${DAYOPT}</select></label>${fld('start','Start','','time','required')}${fld('end','End','','time','required')}<button class="pr" style="align-self:end">Add</button></form>
 ${cat.items.map(o=>`<div class="card nt"><span><b>${esc(o.course)}</b> ${esc(o.term)} · Sec ${esc(o.section)} · ${o.day} ${o.start}-${o.end}</span><span style="flex:1"></span>${btn(`DELETE /admin/offerings/${o.id}`,'Delete',{k:'dg',cf:'Delete offering?'})}</div>`).join('')||'<p class="why">Empty: students can type any section until offerings exist.</p>'}
 <h2>Terms & registration deadlines</h2><form class="card g" data-f="POST /admin/terms" data-ok="Term saved">${fld('name','Term name','','text','required')}${fld('reg_deadline','Registration deadline','','date','required')}<button class="pr" style="align-self:end">Save</button></form>${tr.items.map(t=>`<div class="card nt"><span><b>${esc(t.name)}</b> · deadline ${esc(t.reg_deadline)}</span><span style="flex:1"></span>${btn(`DELETE /admin/terms/${t.id}`,'Delete',{k:'dg'})}</div>`).join('')||'<p class="why">No terms yet. Students get an alert 3 days before a deadline.</p>'}<h2>Users & requests</h2><form class="card g" data-af>${fld('q','Search email, name or course',BQ.aq)}<button class="pr" style="align-self:end">Search</button></form>
 ${sr.users.map(u=>`<div class="card nt"><span><b>${esc(u.name)}</b> <span class="why">${esc(u.email)}${u.banned?' · banned':''}</span></span><span style="flex:1"></span>${u.role!=='admin'&&!u.banned?btn(`POST /admin/users/${u.id}/ban`,'Ban',{k:'dg',cf:'Ban this user?'}):''}</div>`).join('')}
 ${sr.requests.map(x=>`<div class="card nt"><span><b>${esc(x.course)}</b> ${esc(x.cur)} → ${esc(x.want)} · ${esc(x.term)} <span class="why">${esc(x.email)}</span></span>${pill(x.st)}<span style="flex:1"></span>${['active','paused','draft'].includes(x.st)?btn(`POST /admin/requests/${x.id}/remove`,'Remove',{k:'dg',cf:'Remove this request?'}):''}</div>`).join('')}
 <h2>Maintenance</h2><div class="row">${btn('POST /admin/sweep','Close expired requests')}</div>
 <h2>Reports</h2>${r.items.map(x=>`<div class="card">${pill(x.status==='open'?'pending':'completed')} <b>${esc(x.tname)}</b> <span class="why">${esc(x.temail)}${x.banned?' · banned':''}</span><p>${esc(x.reason)}</p>${x.status==='open'?`<div class="row">${btn(`POST /admin/reports/${x.id}/ban`,'Ban user',{k:'dg',cf:'Ban this user?'})}${btn(`POST /admin/reports/${x.id}/dismiss`,'Dismiss')}</div>`:''}</div>`).join('')||empty('No reports.')}<h2>Audit log</h2>${r.audit.map(a=>`<div class="why">${esc(a.created)} · ${esc(a.action)}</div>`).join('')||'<p class="why">Empty.</p>'}`}};
async function render(){const[v,id]=(location.hash.slice(2)||'home').split('/');
 try{const r=await api('GET','/me');me=r.user;unread=r.unread}catch{me=null}
 if(!me){app.innerHTML=authView();return}
 try{const b=await(V[v]||V.home)(id);app.innerHTML=shell(V[v]?v:'home',b)}catch(e){app.innerHTML=shell(v,empty('Could not load this page: '+esc(e.message)))}}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-c],[data-pg],[data-cat],[data-prev]');if(!t)return;if(t.dataset.prev){document.getElementById('pv').innerHTML=tk(Object.fromEntries(new FormData(t.form)));return}
 if(t.dataset.pg){BQ.page=+t.dataset.pg;return render()}if(t.dataset.cat!==undefined){BQ.cat=t.dataset.cat;return render()}
 if(t.dataset.cf&&!confirm(t.dataset.cf))return;let b=t.dataset.b?JSON.parse(t.dataset.b):undefined;if(t.dataset.pr){b={reason:prompt(t.dataset.pr)};if(!b.reason)return}
 const[m,u]=t.dataset.c.split(' ');try{await api(m,u,b);toast(t.dataset.ok);if(u==='/me'||u==='/auth/logout')location.hash='#/home';render()}catch(x){toast(x.message,1)}});
document.addEventListener('submit',async e=>{const f=e.target;e.preventDefault();const b=Object.fromEntries(new FormData(f));
 if(f.dataset.bf){BQ={...b,page:1};return render()}if(f.dataset.hf){Object.assign(BQ,{hc:b.hc,ht:b.ht,hs:b.hs,hd:b.hd});return render()}if(f.dataset.af){BQ.aq=b.q;return render()}if(f.dataset.fg){f.dataset.f='POST /auth/forgot';}if(!f.dataset.f)return;if(e.submitter?.name)b[e.submitter.name]=e.submitter.value;
 const[m,u]=f.dataset.f.split(' ');try{const r=await api(m,u,b);toast(r.verify?'Check your email to verify your account':f.dataset.ok);if(f.dataset.go)location.hash=f.dataset.go;else render()}catch(x){toast(x.message,1)}});
document.addEventListener('change',e=>{const i=e.target;if(!i.dataset.av||!i.files[0])return;const im=new Image();im.onload=async()=>{const c=document.createElement('canvas');c.width=c.height=128;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);try{await api('PATCH','/me',{avatar:c.toDataURL('image/jpeg',.8)});toast('Photo updated');render()}catch(x){toast(x.message,1)}};im.src=URL.createObjectURL(i.files[0])});
addEventListener('hashchange',render);render();
</script></body></html>
