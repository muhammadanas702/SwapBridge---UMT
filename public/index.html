<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0618">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>SectionSwap</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ff;--sf:rgba(255,255,255,.8);--sf2:#fff;--tx:#1b0f33;--mu:#6f5f8c;--pr:#a855f7;--pd:#7e22ce;--ln:rgba(126,34,206,.14);--gl:rgba(168,85,247,.28);--ok:#16a34a;--er:#e11d48;--am:#f59e0b;--g1:#c4b5fd;--g2:#f0abfc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0618;--sf:rgba(32,18,56,.62);--sf2:#1c1030;--tx:#f5eeff;--mu:#a592c6;--pr:#b97bff;--pd:#d8b4fe;--ln:rgba(216,180,254,.13);--gl:rgba(168,85,247,.4);--g1:#6d28d9;--g2:#be185d}}
:root[data-theme="dark"]{--bg:#0c0618;--sf:rgba(32,18,56,.62);--sf2:#1c1030;--tx:#f5eeff;--mu:#a592c6;--pr:#b97bff;--pd:#d8b4fe;--ln:rgba(216,180,254,.13);--gl:rgba(168,85,247,.4);--g1:#6d28d9;--g2:#be185d}
:root[data-theme="light"]{--bg:#f6f1ff;--sf:rgba(255,255,255,.8);--sf2:#fff;--tx:#1b0f33;--mu:#6f5f8c;--pr:#a855f7;--pd:#7e22ce;--ln:rgba(126,34,206,.14);--gl:rgba(168,85,247,.28);--g1:#c4b5fd;--g2:#f0abfc}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 Manrope,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.38;z-index:-1;animation:drift 18s ease-in-out infinite alternate}
body:before{background:var(--g1);top:-25vmax;left:-15vmax}body:after{background:var(--g2);bottom:-30vmax;right:-15vmax;animation-delay:-9s;opacity:.25}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes flt{50%{transform:translateY(-12px) rotate(var(--r))}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes dash{to{background-position:24px 0}}
@keyframes pls{50%{box-shadow:0 0 0 8px transparent}}
@keyframes spin{to{transform:rotate(360deg)}}
h1,h2,h3,.dsp{font-family:Unbounded,sans-serif;letter-spacing:-.03em;margin:0;font-weight:700}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--pd)}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
/* ── TOP NAV ── */
.top{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:10;margin:10px auto 0;width:min(1060px,calc(100% - 24px));display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--sf);backdrop-filter:blur(18px);border:1px solid var(--ln);border-radius:20px;box-shadow:0 10px 40px -18px var(--gl)}
.logo{display:flex;align-items:center;gap:9px;font-family:Unbounded;font-weight:800;font-size:16px;margin-right:auto;padding-left:4px;text-decoration:none;color:var(--tx)}
.lg{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--pr),#ec4899);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px -4px var(--gl)}
.tab{display:flex;align-items:center;gap:7px;border:0;background:none;color:var(--mu);padding:9px 13px;border-radius:12px;font-weight:600;position:relative;transition:.2s;cursor:pointer;text-decoration:none;font-size:14px}
.tab:hover{color:var(--tx);background:var(--ln)}
.tab.on{color:#fff;background:linear-gradient(135deg,var(--pr),var(--pd))}
.tab .bd{position:absolute;top:2px;right:2px;background:var(--er);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;font-style:normal}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--ln);background:none;color:var(--mu);display:grid;place-items:center;cursor:pointer}
.ib:hover{color:var(--tx);border-color:var(--pr)}
/* ── AVATAR ── */
.av{width:var(--s,40px);height:var(--s,40px);border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:calc(var(--s,40px)*.36);flex:none}
.av-img{width:var(--s,40px);height:var(--s,40px);border-radius:50%;object-fit:cover;flex:none}
/* ── MAIN ── */
main{width:min(1060px,calc(100% - 24px));margin:26px auto 60px}
.in>*{animation:up .55s cubic-bezier(.2,.7,.2,1) both}
.in>*:nth-child(2){animation-delay:.07s}.in>*:nth-child(3){animation-delay:.14s}
.in>*:nth-child(4){animation-delay:.21s}.in>*:nth-child(n+5){animation-delay:.28s}
h1{font-size:clamp(26px,4.5vw,40px);line-height:1.1}h2{font-size:18px}
.sub{color:var(--mu);margin:8px 0 24px;max-width:560px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px}
/* ── CARDS ── */
.card{background:var(--sf);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:22px;padding:20px;margin-bottom:14px}
/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.st{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:18px;backdrop-filter:blur(14px)}
.st b{font:700 28px Unbounded;display:block;background:linear-gradient(135deg,var(--pr),#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.st span{color:var(--mu);font-size:13px;font-weight:600}
/* ── CTA BANNER ── */
.cta{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(120deg,var(--pd),var(--pr) 55%,#ec4899);color:#fff;border-radius:22px;padding:20px 24px;margin:16px 0;box-shadow:0 20px 50px -20px var(--gl)}
.cta .btn{background:#fff;color:#4c1d95;border:0}
/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
/* ── TICKET ── */
.tk{position:relative;background:var(--sf);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:22px;padding:18px 18px 16px;transition:.3s;-webkit-mask:radial-gradient(circle 11px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 11px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;margin-bottom:0}
.tk:hover{transform:translateY(-5px);border-color:var(--pr)}
.tk:hover .sw svg{transform:rotate(180deg)}
.tk .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-bottom:22px;border-bottom:2px dashed var(--ln)}
.tk .hd b{display:block;font-size:15px}
.tk .bd2{padding-top:16px}
/* ── SWAP PILL ROW ── */
.sw{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sw svg{color:var(--pr);transition:.5s}
.pill-sec{font:700 15px Unbounded;min-width:46px;text-align:center;padding:8px 12px;border-radius:14px;background:linear-gradient(135deg,var(--ln),transparent);border:1px solid var(--ln);color:var(--pd);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.pill-sec.w{background:linear-gradient(135deg,var(--pr),var(--pd));color:#fff;border:0}
.tm{color:var(--mu);font-size:12px;margin-top:8px}
/* ── STATUS TAGS ── */
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;background:var(--ln);color:var(--pd);white-space:nowrap}
.tag.active,.tag.live,.tag.completed,.tag.mutual{background:rgba(22,163,74,.16);color:var(--ok)}
.tag.paused,.tag.pending,.tag.draft,.tag.approval_pending{background:rgba(245,158,11,.18);color:var(--am)}
.tag.cancelled,.tag.declined,.tag.expired,.tag.suspended,.tag.closed,.tag.banned{background:rgba(225,29,72,.14);color:var(--er)}
.tag.matched{background:rgba(236,72,153,.16);color:#ec4899}
/* ── LAYOUT UTILS ── */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sb{justify-content:space-between}
/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ln);background:none;padding:9px 15px;border-radius:12px;font-weight:700;font-size:14px;transition:.2s;text-decoration:none;cursor:pointer;color:var(--tx)}
.btn:hover{border-color:var(--pr);transform:translateY(-1px)}
.btn.p,.pr{background:linear-gradient(135deg,var(--pr),var(--pd));color:#fff;border:0;box-shadow:0 10px 24px -10px var(--gl)}
.btn.d,.dg{color:var(--er)}
.btn.s{padding:6px 11px;font-size:13px}
/* ── NEW PLACEHOLDER ── */
.new{border:2px dashed var(--ln);border-radius:22px;display:grid;place-items:center;min-height:160px;color:var(--mu);background:none;font-weight:700;transition:.3s;width:100%}
.new:hover{border-color:var(--pr);color:var(--pd);background:var(--ln)}
.new svg{width:28px;height:28px;margin-bottom:6px}
/* ── DUEL LAYOUT ── */
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:18px 0 8px;text-align:center}
.side{display:flex;flex-direction:column;align-items:center;gap:6px}
.side em{font-style:normal;font-size:12px;font-weight:700;color:var(--am)}
.side em.ok{color:var(--ok)}.side em.no{color:var(--er)}
.side small{color:var(--mu)}
.side .av,.side .av-img{box-shadow:0 0 0 4px var(--ln)}
.side.go .av,.side.go .av-img{box-shadow:0 0 0 4px var(--ok);animation:pls 2s infinite}
.br{width:70px;height:40px;display:grid;place-items:center;color:var(--pr);background:repeating-linear-gradient(90deg,var(--pr) 0 8px,transparent 8px 16px) center/100% 2px no-repeat;animation:dash 1s linear infinite}
.br span{background:var(--sf2);border:1px solid var(--ln);border-radius:50%;width:34px;height:34px;display:grid;place-items:center}
.cd{font:500 13px 'JetBrains Mono';color:var(--am)}
/* ── FORMS ── */
label.l{display:block;font-size:12px;font-weight:700;margin:16px 0 7px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
label.lf{display:grid;gap:4px;font-size:13px;color:var(--mu);font-weight:600;margin-bottom:10px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);border-color:transparent}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.full{grid-column:1/-1}
.ch{display:flex;gap:8px;flex-wrap:wrap}
.c{border:1px solid var(--ln);background:var(--sf2);border-radius:14px;padding:9px 13px;font-weight:600;text-align:left;transition:.2s;cursor:pointer;color:var(--tx)}
.c small{display:block;color:var(--mu);font-weight:500;font-size:11px}
.c.on{background:linear-gradient(135deg,var(--pr),var(--pd));color:#fff;border-color:transparent}
.c.on small{color:#f3e8ff}
/* ── MODAL ── */
.ov{position:fixed;inset:0;background:rgba(8,3,20,.6);backdrop-filter:blur(6px);z-index:30;display:grid;place-items:center;padding:14px;animation:pop .25s}
.md{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--sf2);border:1px solid var(--ln);border-radius:26px;padding:24px;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
/* ── NOTIFICATION ROWS ── */
.lst{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--ln)}
.lst:last-child{border:0}
.dt{width:9px;height:9px;border-radius:50%;background:var(--pr);margin-top:7px;flex:none}
.dt.r{background:var(--ln)}
.nt{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--ln)}
.nt.u{border-left:3px solid var(--pr)}
.nt:last-child{border-bottom:0}
/* ── EMPTY ── */
.empty{text-align:center;color:var(--mu);padding:34px 10px;border:2px dashed var(--ln);border-radius:20px;grid-column:1/-1}
/* ── TABLE ── */
.scr{overflow-x:auto}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln);font-size:14px;white-space:nowrap}
th{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
code{font:500 12.5px 'JetBrains Mono';background:var(--ln);padding:2px 7px;border-radius:7px}
/* ── HINT ── */
.hint{font-size:11px;font-weight:700;color:var(--ok);background:rgba(22,163,74,.12);padding:3px 9px;border-radius:99px;margin-right:4px}
/* ── TOAST ── */
.toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:14px;font-weight:600;z-index:50;animation:up .3s;max-width:90vw;pointer-events:none}
.toast.bad{background:var(--er);color:#fff}
/* ── AUTH PAGE ── */
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh;align-items:center;gap:30px;padding:30px max(24px,6vw)}
.hero h1{font-size:clamp(34px,5.4vw,64px);line-height:1.02}
.hero h1 span{background:linear-gradient(120deg,var(--pr),#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.stack{position:relative;height:230px;margin-top:34px}
.stack .tk{position:absolute;width:270px;--r:-4deg;animation:flt 6s ease-in-out infinite}
.stack .tk:nth-child(2){left:150px;top:70px;--r:3deg;animation-delay:-3s}
/* ── AUTH FORM CARD ── */
.auth-card{max-width:430px;width:100%;justify-self:center;padding:28px;animation:pop .5s}
.atabs{display:flex;gap:8px;margin-bottom:18px}
/* ── LOADER ── */
.spin{width:22px;height:22px;border:3px solid var(--ln);border-top-color:var(--pr);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
/* ── WHY ── */
.why{color:var(--mu);font-size:13px}
.note{color:var(--mu);font-size:12px;margin-top:12px}
/* ── CANVAS ── */
canvas{position:fixed;inset:0;pointer-events:none;z-index:60}
/* ── MOBILE ── */
.mob .auth{grid-template-columns:1fr;padding:22px 16px;min-height:100vh}
.mob .hero h1{font-size:34px}
.mob .tab span{display:none}
.mob .top{position:fixed;top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:12px;right:12px;margin:0;width:auto;justify-content:space-around;padding:6px}
.mob .top .logo,.mob .top .ib.h{display:none}
.mob .tab{padding:12px 15px}
.mob main{margin:18px auto 120px}
.mob .stats{gap:8px}
.mob .st{padding:12px}
.mob .st b{font-size:20px}
.mob .stack .tk{width:240px}
.mob .stack .tk:nth-child(2){left:70px}
.mob .duel{gap:4px}
.mob .br{width:44px}
.mob .btn{min-height:42px}
.mob .grid{grid-template-columns:1fr}
.mob .ov{place-items:end center;padding:0}
.mob .md{width:100%;border-radius:28px 28px 0 0}
.mob .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.mob .fab{display:grid;position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--pr),#ec4899);color:#fff;place-items:center;box-shadow:0 14px 30px -8px var(--gl);z-index:12}
.mob .fab svg{width:26px;height:26px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div>
<div id="modal"></div>
<div id="toastbox"></div>
<button class="fab" id="fabBtn" aria-label="New request" onclick="location.hash='#/new'">
<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>
<script>
/* ─────────────────────────────────────────────
   ICONS
───────────────────────────────────────────── */
const IC={
  swap:'<path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',
  home:'<path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  sun:'<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  calendar:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  arr:'<path d="M5 12h14m-6-6 6 6-6 6"/>',
  clk:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24">${IC[n]||''}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ─────────────────────────────────────────────
   UTILS
───────────────────────────────────────────── */
const $=s=>document.querySelector(s);
const ago=t=>{const s=(Date.now()-new Date(t).getTime())/1e3;return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
function hsh(str){let h=5381;for(const c of str+'ss')h=(h*33)^c.charCodeAt(0);return(h>>>0).toString(36)}
const av=(n,z=40)=>{const h=250+[...hsh(n||'?')].reduce((a,c)=>a+c.charCodeAt(0),0)%90;return`<span class="av" style="--s:${z}px;background:linear-gradient(135deg,hsl(${h} 85% 64%),hsl(${h+45} 85% 50%))">${n?n.split(' ').map(x=>x[0]).join('').slice(0,2):'?'}</span>`};
const avEl=(u,z=40)=>{if(u&&u.avatar)return`<img class="av-img" style="--s:${z}px" src="${esc(u.avatar)}" alt="${esc(u.name)}">`; return av(u?.name||'?',z)};

/* ─────────────────────────────────────────────
   API + STATE
───────────────────────────────────────────── */
let me=null,unread=0,CAT=[],BQ={page:1};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
async function api(m,u,b){const r=await fetch('/api/v1'+u,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Something went wrong');return d}
function toast(msg,bad=false){const e=document.createElement('div');e.className='toast'+(bad?' bad':'');e.textContent=msg;e.setAttribute('role','status');document.getElementById('toastbox').append(e);setTimeout(()=>e.remove(),3500)}

/* ─────────────────────────────────────────────

<div class="stats">${Object.entries(s).map(([k,v])=>`<div class="st"><b>${v}</b><span>${k}</span></div>`).join('')}</div>
<div class="sec"><h2>Course catalog</h2></div>
<div class="card">
  <form class="fg" data-f="POST /admin/offerings" data-ok="Offering added">
    ${fld('course','Course code','','text','required')}${fld('cname','Course name','','text','required')}${fld('term','Term','','text','required')}${fld('section','Section','','text','required')}
    <label class="lf">Day<select name="day">${DAYOPT}</select></label>${fld('start','Start','','time','required')}${fld('end','End','','time','required')}
    <button class="btn p" style="align-self:end">${ic('plus')} Add</button>
  </form>
</div>
${cat.items.map(o=>`<div class="card"><div class="row sb"><span><b>${esc(o.course)}</b> ${esc(o.term)} · Sec ${esc(o.section)} · ${o.day} ${o.start}–${o.end}</span>${actionBtn(`DELETE /admin/offerings/${o.id}`,'Delete',{k:'d',cf:'Delete offering?'})}</div></div>`).join('')||'<p class="why">Empty: students can type any section until offerings exist.</p>'}
<div class="sec"><h2>Terms &amp; deadlines</h2></div>
<div class="card">
  <form class="fg" data-f="POST /admin/terms" data-ok="Term saved">
    ${fld('name','Term name','','text','required')}${fld('reg_deadline','Registration deadline','','date','required')}
    <button class="btn p" style="align-self:end">Save</button>
  </form>
</div>
${tr.items.map(t=>`<div class="card"><div class="row sb"><span><b>${esc(t.name)}</b> · deadline ${esc(t.reg_deadline)}</span>${actionBtn(`DELETE /admin/terms/${t.id}`,'Delete',{k:'d'})}</div></div>`).join('')||'<p class="why">No terms yet.</p>'}
<div class="sec"><h2>Users &amp; requests</h2></div>
<div class="card">
  <form class="fg" data-af>
    ${fld('q','Search email, name or course',BQ.aq)}
    <button class="btn p" style="align-self:end">${ic('search')} Search</button>
  </form>
</div>
${sr.users.map(u=>`<div class="card"><div class="row sb"><div class="row">${avEl(u,36)}<span><b>${esc(u.name)}</b> <span class="why">${esc(u.email)}${u.banned?' · banned':''}</span></span></div>${u.role!=='admin'&&!u.banned?actionBtn(`POST /admin/users/${u.id}/ban`,'Ban',{k:'d',cf:'Ban this user?'}):''}</div></div>`).join('')}
${sr.requests.map(x=>`<div class="card"><div class="row sb"><span><b>${esc(x.course)}</b> ${esc(x.cur)} → ${esc(x.want)} · ${esc(x.term)} <span class="why">${esc(x.email)}</span></span>${tagEl(x.st)}${['active','paused','draft'].includes(x.st)?actionBtn(`POST /admin/requests/${x.id}/remove`,'Remove',{k:'d',cf:'Remove this request?'}):''}</div></div>`).join('')}
<div class="sec"><h2>Maintenance</h2></div>
<div class="row">${actionBtn('POST /admin/sweep','Close expired requests')}</div>
<div class="sec"><h2>Reports</h2></div>
${rp.items.map(x=>`<div class="card"><div class="row sb">${tagEl(x.status==='open'?'pending':'completed')}<div><b>${esc(x.tname)}</b> <span class="why">${esc(x.temail)}</span><p style="margin:4px 0">${esc(x.reason)}</p>${x.status==='open'?`<div class="row">${actionBtn(`POST /admin/reports/${x.id}/ban`,'Ban user',{k:'d',cf:'Ban this user?'})}${actionBtn(`POST /admin/reports/${x.id}/dismiss`,'Dismiss')}</div>`:''}</div></div></div>`).join('')||emptyEl('No reports.')}
<div class="sec"><h2>Audit log</h2></div>
<div class="card">
  ${rp.audit?.map(a=>`<div class="tm">${esc(a.created)} · ${esc(a.action)}</div>`).join('')||'<p class="why">Empty.</p>'}

/* ─────────────────────────────────────────────
   RENDER
───────────────────────────────────────────── */
const app=document.getElementById('app');
async function render(){
  const[v,id]=(location.hash.slice(2)||'home').split('/');
  try{const r=await api('GET','/me');me=r.user;unread=r.unread}catch{me=null}
  if(!me){app.innerHTML=authView();return}
  try{
    const body=await(V[v]||V.home)(id);
    app.innerHTML=shell(V[v]?v:'home',body);
  }catch(e){
    app.innerHTML=shell(v,emptyEl('Could not load this page: '+esc(e.message)));
  }
  applyDev();
}

/* ─────────────────────────────────────────────
   EFFECTS: tick (countdown), confetti
───────────────────────────────────────────── */
function tick(){document.querySelectorAll('[data-x]').forEach(e=>{const d=+e.dataset.x-Date.now();if(d<=0)return e.textContent='Expired';const h=Math.floor(d/36e5),m=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);e.textContent=`${h}h ${m}m ${s}s left`})}
setInterval(tick,1000);
function boom(){const c=document.createElement('canvas'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;document.body.append(c);const P=[...Array(110)].map(()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*18,vy:Math.random()*-16-3,s:4+Math.random()*6,h:260+Math.random()*90,r:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=`hsl(${p.h} 90% 62%)`;x.fillRect(0,0,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(a);else c.remove()})()}

/* ─────────────────────────────────────────────
   THEME
───────────────────────────────────────────── */
function toggleTheme(){const cur=document.documentElement.dataset.theme;const isDark=cur==='dark'||(cur!=='light'&&window.matchMedia('(prefers-color-scheme:dark)').matches);const next=isDark?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem('ss_th',next)}catch(e){}render()}
try{const t=localStorage.getItem('ss_th');if(t)document.documentElement.dataset.theme=t}catch(e){}

/* ─────────────────────────────────────────────
   RESPONSIVE
───────────────────────────────────────────── */
function applyDev(){const w=innerWidth<780;document.documentElement.classList.toggle('mob',w)}
addEventListener('resize',applyDev);applyDev();

/* ─────────────────────────────────────────────
   AUTH HELPERS
───────────────────────────────────────────── */
async function doLogout(){try{await api('POST','/auth/logout')}catch(e){}me=null;location.hash='#/home';render()}

/* ─────────────────────────────────────────────
   CLICK HANDLER
───────────────────────────────────────────── */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-c],[data-pg],[data-cat],[data-prev]');
  if(!t)return;
  if(t.dataset.prev){const pv=document.getElementById('pv');if(pv)pv.innerHTML=ticket(Object.fromEntries(new FormData(t.form)));return}
  if(t.dataset.pg){BQ.page=+t.dataset.pg;return render()}
  if(t.dataset.cat!==undefined){BQ.cat=t.dataset.cat;return render()}
  if(t.dataset.cf&&!confirm(t.dataset.cf))return;
  let b=t.dataset.b?JSON.parse(t.dataset.b):undefined;
  if(t.dataset.pr){b={reason:prompt(t.dataset.pr)};if(!b.reason)return}
  const[m,u]=t.dataset.c.split(' ');
  t.disabled=true;
  try{
    const res=await api(m,u,b);
    toast(t.dataset.ok||'Done');
    if(u==='/me'||u==='/auth/logout'){location.hash='#/home'}
    if(res&&res.status==='completed')boom();
    render();
  }catch(x){toast(x.message,true)}
  finally{t.disabled=false}
});

/* ─────────────────────────────────────────────
   SUBMIT HANDLER
───────────────────────────────────────────── */
document.addEventListener('submit',async e=>{
  const f=e.target;e.preventDefault();
  const b=Object.fromEntries(new FormData(f));
  if(f.dataset.bf){BQ={...b,page:1};return render()}
  if(f.dataset.hf){Object.assign(BQ,{hc:b.hc,ht:b.ht,hs:b.hs,hd:b.hd});return render()}
  if(f.dataset.af){BQ.aq=b.q;return render()}
  if(!f.dataset.f)return;
  if(e.submitter?.name)b[e.submitter.name]=e.submitter.value;
  const[m,u]=f.dataset.f.split(' ');
  const sub=f.querySelector('button[type=submit],button.pr');
  if(sub)sub.disabled=true;
  try{
    const r=await api(m,u,b);
    toast(r.verify?'Check your email to verify your account':f.dataset.ok||'Done');
    if(f.dataset.go)location.hash=f.dataset.go;
    else render();
  }catch(x){toast(x.message,true)}
  finally{if(sub)sub.disabled=false}
});

/* ─────────────────────────────────────────────
   AVATAR FILE CHANGE
───────────────────────────────────────────── */
document.addEventListener('change',e=>{
  const i=e.target;
  if(!i.dataset.av||!i.files[0])return;
  const im=new Image();
  im.onload=async()=>{
    const c=document.createElement('canvas');c.width=c.height=128;
    const s=Math.min(im.width,im.height);
    c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);
    try{await api('PATCH','/me',{avatar:c.toDataURL('image/jpeg',.8)});toast('Photo updated');render()}
    catch(x){toast(x.message,true)}
  };
  im.src=URL.createObjectURL(i.files[0]);
});

/* ─────────────────────────────────────────────
   ROUTING
───────────────────────────────────────────── */
addEventListener('hashchange',render);
render();
</script>
